<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JobOS Importer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <label>
        API URL
        <input id="apiUrl" type="url" placeholder="http://localhost:4000" />
      </label>
      <label>
        Import token
        <input id="token" type="password" placeholder="jobos-dev-extension-token" />
      </label>
      <button id="previewPage" type="button">Preview current page</button>
      <section id="preview" hidden>
        <dl>
          <div>
            <dt>Role</dt>
            <dd id="previewTitle"></dd>
          </div>
          <div>
            <dt>Company</dt>
            <dd id="previewCompany"></dd>
          </div>
          <div>
            <dt>Location</dt>
            <dd id="previewLocation"></dd>
          </div>
          <div>
            <dt>Compensation</dt>
            <dd id="previewSalary"></dd>
          </div>
        </dl>
        <div id="duplicates" hidden>
          <strong>Possible duplicate</strong>
          <ul id="duplicateList"></ul>
        </div>
        <button id="savePage" type="button">Save to JobOS</button>
      </section>
      <p id="status" role="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
