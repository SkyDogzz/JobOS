<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JobOS Importer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <label>
        API URL
        <input id="apiUrl" type="url" placeholder="http://localhost:4000" />
      </label>
      <label>
        Import token
        <input id="token" type="password" placeholder="jobos-dev-extension-token" />
      </label>
      <button id="savePage" type="button">Save current page</button>
      <p id="status" role="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
